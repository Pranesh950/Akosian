<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Akosian</title>
    <meta name="description" content="Free, open-source health tracking. Get Akosian for iPhone or Android, or find the source on GitHub." />
    <meta name="theme-color" content="#fafaf8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Akosian</h1>
      <p class="intro">Free, open-source health tracking.</p>

      <section aria-labelledby="ios">
        <h2 id="ios">iPhone</h2>
        <a href="https://testflight.apple.com/join/HvNZzY4D">Get the iOS beta →</a>
        <p>Open on your iPhone. Install through TestFlight.</p>
      </section>

      <section aria-labelledby="android">
        <h2 id="android">Android</h2>
        <ol>
          <li><a href="https://groups.google.com/g/akosian">Join the testing group</a></li>
          <li><a href="https://play.google.com/apps/testing/com.myrri.app">Become a tester</a></li>
          <li><a href="https://play.google.com/store/apps/details?id=com.myrri.app">Install from Google Play</a></li>
        </ol>
        <p>Use the same Google account for all three steps.</p>
      </section>

      <section aria-labelledby="github">
        <h2 id="github">GitHub</h2>
        <a href="https://github.com/Pranesh950/Akosian">Source code &amp; issues →</a>
      </section>
    </main>
  </body>
</html>
